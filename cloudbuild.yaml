# cloudbuild.yaml - Configuration for Google Cloud Build

substitutions:
  _REGION: "europe-west1"
  _REPO_NAME: "my-crud-app"
  _IMAGE_NAME: "my-crud-app"
  _SERVICE_NAME: "my-crud-app"
  _PORT: "3000"

steps:
  # Step 1 : Build Docker Image
  - name: "gcr.io/cloud-builders/docker"
    args:
      - "build"
      - "-t"
      - "europe-west1-docker.pkg.dev/mycrudapp-478912/my-crud-app/my-crud-app:latest"
      - "-t"
      # - '${_REGION}-docker.pkg.dev/mycrudapp-478912/my-crud-app/my-crud-app:$BUILD_ID'
      - "."

  # Step 2 : Push image to Artifact Registry
  - name: "gcr.io/cloud-builders/docker"
    args:
      - "push"
      - "europe-west1-docker.pkg.dev/mycrudapp-478912/my-crud-app/my-crud-app:latest"

  - name: "gcr.io/cloud-builders/docker"
    args:
      - "push"
      - "europe-west1-docker.pkg.dev/mycrudapp-478912/my-crud-app/my-crud-app:$BUILD_ID"

  # Step 3 : Deploy on Cloud Run
  - name: "gcr.io/google.com/cloudsdktool/cloud-sdk"
    entrypoint: gcloud
    args:
      - "run"
      - "deploy"
      - "${_SERVICE_NAME}"
      - "--image=europe-west1-docker.pkg.dev/mycrudapp-478912/my-crud-app/my-crud-app:latest"
      - "--region=europe-west1"
      - "--platform=managed"
      - "--allow-unauthenticated"
      - "--port=${_PORT}"

# Images to be stored on Artifact Registry
images:
  - "${_REGION}-docker.pkg.dev/mycrudapp-478912/my-crud-app/my-crud-app:latest"
  - "${_REGION}-docker.pkg.dev/mycrudapp-478912/my-crud-app/my-crud-app:$BUILD_ID"

# Build Options
options:
  logging: CLOUD_LOGGING_ONLY
  machineType: "E2_HIGHCPU_8"

# Build timeout (10 minutes)
timeout: "600s"
#dynamic_substitutions: true
